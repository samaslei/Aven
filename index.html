<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aven — Academic Operating System</title>
  <meta name="description" content="Aven is a unified, cohesive academic operating system for students organized around subjects, study tracking, weighted grades, and study plans.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><rect width='24' height='24' rx='6'/><path d='M6 18L12 6L18 18H14L12 13L10 18H6Z' fill='white'/></svg>">
</head>
<body>
  <div id="app">
    <!-- Mobile Backdrop for Off-Canvas Sidebar Drawer -->
    <div class="mobile-drawer-backdrop" id="mobile-drawer-backdrop"></div>

    <!-- Mobile Top Navigation Bar (Shown on < 768px viewports) -->
    <header class="mobile-top-bar" id="mobile-top-bar">
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle Navigation Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <a href="#subjects" class="brand mobile-brand">
        <div class="brand-icon">A</div>
        <span class="brand-text">Aven</span>
        <span class="brand-tag">v1.1</span>
      </a>

      <button class="btn-ghost btn-icon mobile-quick-theme-btn" id="mobile-theme-btn" aria-label="Toggle Theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
        </svg>
      </button>
    </header>

    <!-- Fixed Left Sidebar (Pinned on Desktop, Slide-out Drawer on Mobile) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <!-- Brand / Logo -->
        <a href="#subjects" class="brand">
          <div class="brand-icon">A</div>
          <span class="brand-text">Aven</span>
          <span class="brand-tag">v1.1</span>
        </a>


        <!-- Page Navigation List -->
        <nav>
          <ul class="nav-list">
            <li class="nav-item">
              <a class="nav-link active" data-page="subjects">
                <span class="nav-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                  </svg>
                </span>
                <span>Subjects</span>
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" data-page="tracker">
                <span class="nav-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                  </svg>
                </span>
                <span>Study Tracker</span>
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" data-page="grades">
                <span class="nav-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                  </svg>
                </span>
                <span>Grades</span>
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" data-page="plans">
                <span class="nav-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                  </svg>
                </span>
                <span>Study Plans</span>
              </a>
            </li>

            <li class="nav-item has-submenu" id="nav-item-settings">
              <a class="nav-link" data-page="settings" id="nav-link-settings">
                <span class="nav-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                  </svg>
                </span>
                <span>Settings</span>
                <span class="nav-chevron">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </span>
              </a>
              <ul class="nav-submenu" id="settings-submenu">
                <li>
                  <a class="nav-sublink" data-section="settings-appearance">
                    <span>Appearance</span>
                  </a>
                </li>
                <li>
                  <a class="nav-sublink" data-section="settings-academic">
                    <span>Academic Defaults</span>
                  </a>
                </li>
                <li>
                  <a class="nav-sublink" data-section="settings-tracker">
                    <span>Study Tracker</span>
                  </a>
                </li>
                <li>
                  <a class="nav-sublink" data-section="settings-account">
                    <span>Account</span>
                  </a>
                </li>
                <li>
                  <a class="nav-sublink" data-section="settings-data">
                    <span>Data Management</span>
                  </a>
                </li>
              </ul>
            </li>
          </ul>
        </nav>
      </div>

      <!-- User Profile Row Pinned at Bottom -->
      <div class="sidebar-bottom">
        <div class="user-popover" id="user-popover">
          <button class="popover-item" id="toggle-theme-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            Toggle Light / Dark Mode
          </button>
          <button class="popover-item" id="reset-demo-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="1 4 1 10 7 10"></polyline>
              <polyline points="23 20 23 14 17 14"></polyline>
              <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
            </svg>
            Reset Demo Dataset
          </button>
          <div style="height: 1px; background: var(--border-subtle); margin: 2px 0;"></div>
          <button class="popover-item danger" id="logout-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Log Out
          </button>
        </div>

        <button class="user-profile-btn" id="user-profile-btn" aria-label="Open User Menu">
          <div class="user-avatar" id="user-avatar">AR</div>
          <div class="user-info">
            <span class="user-name" id="user-name">Alex Rivera</span>
            <span class="user-email" id="user-email">alex.rivera@university.edu</span>
          </div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left: auto; color: var(--text-muted);">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
      </div>
    </aside>

    <!-- Main Content Viewport (Scrolls Independently) -->
    <main class="main-viewport">
      <!-- Page Header -->
      <header class="page-header">
        <div class="header-title-group">
          <h1 class="page-title" id="page-title">Subjects</h1>
          <p class="page-subtitle" id="page-subtitle">Track your enrolled courses, study progress, and academic standing at a glance.</p>
        </div>
      </header>

      <!-- Dynamic Page Content Container -->
      <section id="view-content" class="view-content-area">
        <!-- Rendered dynamically by page routers -->
      </section>
    </main>

    <!-- Global Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Global Modal Portal (Attached at root of body for true full-viewport centering & dimming) -->
    <div id="modal-portal"></div>
  </div>

  <!-- Main JavaScript Module -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
